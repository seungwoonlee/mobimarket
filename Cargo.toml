[package]
name = "mobi_market"
version = "1.1.0"
edition = "2021"
authors = ["seungwoonlee"]
description = "Mabinogi Mobile Market Price Tracker & Crafting Cost Calculator"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.29"

[dev-dependencies]
tempfile = "3.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
